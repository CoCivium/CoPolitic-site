name: CoPolitic R0 source/human/AI parity (read-only)

permissions:
  contents: read

on:
  push:
    paths:
      - "index.html"
      - "ai/index.json"
      - "llms.txt"
      - "tests/test_copolitic_site_r0.py"
      - "tests/test_w03_research.py"
      - "research/**"
      - "tests/copolitic_browser_first_use_r0.cjs"
      - ".github/workflows/copolitic-first-use-r0.yml"
  pull_request:
    paths:
      - "index.html"
      - "ai/index.json"
      - "llms.txt"
      - "tests/test_copolitic_site_r0.py"
      - "tests/test_w03_research.py"
      - "research/**"
      - "tests/copolitic_browser_first_use_r0.cjs"
      - ".github/workflows/copolitic-first-use-r0.yml"
  workflow_dispatch:

jobs:
  static-human-machine-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Use Python standard library
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check 24 structural and negative policy cases
        run: python -B -m unittest discover -s tests -p 'test_copolitic_site_r0.py' -v
      - name: Check W03 research page gate
        run: python -B -m unittest discover -s tests -p 'test_w03_research.py' -v


  browser-first-use:
    # Hosted CI sees this PR's checked-out bytes, not copolitic.org.
    needs: static-human-machine-parity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact source without persistent token
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use pinned Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Exercise Chromium local source, no external requests
        run: |
          set -euo pipefail
          if ! command -v google-chrome >/dev/null && ! command -v google-chrome-stable >/dev/null; then
            echo "HOLD_BROWSER_BINARY_NOT_PRESENT"
            exit 1
          fi
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright-core@1.56.0
          node tests/copolitic_browser_first_use_r0.cjs
      - name: Retain PR-only browser QA receipt and screenshots
        uses: actions/upload-artifact@v4
        with:
          name: copolitic-pr-browser-first-use-${{ github.run_id }}-a${{ github.run_attempt }}
          path: out/copolitic-first-use-r0/
          if-no-files-found: error
          retention-days: 14
